services:
  # ====================================================================
  # PRIMARY DATA LAYER
  # ====================================================================

  pg-1:
    image: timescale/timescaledb:latest-pg17
    container_name: nfl-analytics-pg-1
    environment:
      - POSTGRES_USER=dro
      - POSTGRES_PASSWORD=sicillionbillions
      - POSTGRES_DB=devdb01
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dro -d devdb01"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nfl-analytics

  # ====================================================================
  # CACHING LAYER
  # ====================================================================

  redis:
    image: redis:7-alpine
    container_name: nfl-analytics-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme_redis_password}
      - --maxmemory
      - "2gb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nfl-analytics

networks:
  nfl-analytics:
    external: true

volumes:
  redis_data:
    driver: local
