services:
  # ====================================================================
  # PRIMARY DATA LAYER
  # ====================================================================

  pg-1:
    image: timescale/timescaledb:latest-pg16
    container_name: nfl-analytics-pg-1
    environment:
      - POSTGRES_USER=dro
      - POSTGRES_PASSWORD=sicillionbillions
      - POSTGRES_DB=devdb01
    ports:
      - "5544:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dro -d devdb01"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nfl-analytics

  # ====================================================================
  # CACHING LAYER
  # ====================================================================

  redis:
    image: redis:7-alpine
    container_name: nfl-analytics-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme_redis_password}
      - --maxmemory
      - "2gb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nfl-analytics

  # ====================================================================
  # API LAYER
  # ====================================================================

  api:
    build:
      context: .
      dockerfile: containers/Dockerfile.api
    container_name: nfl-analytics-api
    environment:
      - DATABASE_URL=postgresql://dro:sicillionbillions@nfl-analytics-pg-1:5432/devdb01
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis_password}@nfl-analytics-redis:6379
      - REDIS_HOST=nfl-analytics-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_password}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - MODELS_DIR=/app/models
      - ENSEMBLE_VERSION=v5
      # Database credentials for ensemble predictions
      - DB_HOST=nfl-analytics-pg-1
      - DB_PORT=5432
      - DB_NAME=devdb01
      - DB_USER=dro
      - DB_PASSWORD=sicillionbillions
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./py:/app/py:ro  # Mount py/ directory for ensemble module (read-only)
      - ./models:/app/models:ro  # Mount models directory (read-only)
      - ./logs/api:/app/logs
    depends_on:
      pg-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - nfl-analytics

  # ====================================================================
  # PRESENTATION LAYER - SPLIT SERVICES
  # ====================================================================

  # Streamlit dashboard for interactive exploration
  streamlit:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: nfl-analytics-streamlit
    environment:
      - DB_HOST=nfl-analytics-pg-1
      - DB_PORT=5432
      - DB_NAME=devdb01
      - DB_USER=dro
      - DB_PASSWORD=sicillionbillions
      - REDIS_HOST=nfl-analytics-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_password}
      - FASTAPI_URL=http://api:8000
      - LOG_LEVEL=INFO
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - ./models:/app/models:ro  # Mount models directory (read-only)
      - ./py:/app/py:ro # Mount py/ directory for claude_cache (read-only)
    depends_on:
      pg-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - nfl-analytics

  # Prometheus time-series database and metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: nfl-analytics-prometheus
    user: "65534"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      pg-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nfl-analytics

  # Grafana dashboarding and visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nfl-analytics-grafana
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sicillionbillions}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=info
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      pg-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - nfl-analytics

  # ====================================================================
  # MCP SERVER (Claude integration)
  # ====================================================================

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: nfl-analytics-mcp
    environment:
      - DATABASE_URL=postgresql://dro:sicillionbillions@nfl-analytics-pg-1:5432/devdb01
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_redis_password}@nfl-analytics-redis:6379
      - REDIS_HOST=nfl-analytics-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_password}
      - MCP_LOG_LEVEL=INFO
      - MCP_SERVER_PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - APIFY_API_KEY=${APIFY_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./logs/mcp:/app/logs/mcp
      - ./cache/mcp:/app/cache/mcp
      # Phase 1 Integration: Filesystem access for model artifacts, logs, data
      - ./models:/app/models:ro  # Read-only access to models
      - ./logs:/app/logs  # Read-write for log analysis
      - ./data:/app/data:ro  # Read-only access to data files
      - ./results:/app/results  # Read-write for results
    depends_on:
      pg-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: "no"
    networks:
      - nfl-analytics
    profiles:
      - mcp

  # ====================================================================
  # ODDS FETCHING SERVICE
  # ====================================================================

  odds-fetcher:
    build:
      context: .
      dockerfile: containers/Dockerfile.odds-fetcher
    container_name: nfl-analytics-odds-fetcher
    environment:
      - ODDS_API_KEY=${ODDS_API_KEY}
      - DB_HOST=nfl-analytics-pg-1
      - DB_PORT=5432
      - DB_NAME=devdb01
      - DB_USER=dro
      - DB_PASSWORD=sicillionbillions
      - POLL_INTERVAL=${ODDS_POLL_INTERVAL:-900}
      - LINE_MOVE_THRESHOLD=${LINE_MOVE_THRESHOLD:-5.0}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/odds:/app/logs/odds
    depends_on:
      pg-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/logs/odds/odds_service_$(date +%Y%m%d).log"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - nfl-analytics
    profiles:
      - odds

  # ====================================================================
  # MONITORING - EXPORTERS
  # ====================================================================

  # PostgreSQL exporter for database metrics
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nfl-analytics-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://dro:sicillionbillions@nfl-analytics-pg-1:5432/devdb01?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      pg-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - nfl-analytics

  # Node exporter for system metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: nfl-analytics-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - nfl-analytics

  # Alertmanager for notifications (optional profile)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nfl-analytics-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - nfl-analytics
    profiles:
      - alerts

networks:
  nfl-analytics:
    external: true

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
