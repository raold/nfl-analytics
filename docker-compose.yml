# Local development database (devdb01). Start it with `make db` or `docker compose up -d pg-1`;
# scripts/dev/init_dev.sh also applies the schema to an empty database (db/README.md).
#
# Dev only: POSTGRES_PASSWORD is the project's long-public dev password. It sets the password
# of a NEW data directory only, the port is bound to 127.0.0.1, and the role is a superuser,
# so never publish this port or reuse the password anywhere else.
services:
  pg-1:
    image: timescale/timescaledb:latest-pg17
    container_name: nfl-analytics-pg-1
    environment:
      - POSTGRES_USER=dro
      - POSTGRES_PASSWORD=sicillionbillions
      - POSTGRES_DB=devdb01
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dro -d devdb01"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
