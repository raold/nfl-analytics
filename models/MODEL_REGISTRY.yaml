# Archived/Failed Models
archived_models:
  # BNN Variants (All Failed)
  bnn_nuts:
    status: "archived"
    reason: "Timeout after 6+ hours per configuration"
    archived_date: "2025-10-15"

  bnn_mc_dropout:
    status: "archived"
    reason: "Gradient explosion → NaN losses after epoch 12-18"
    archived_date: "2025-10-20"

  bnn_temperature_unscaled:
    status: "archived"
    reason: "Severe undercalibration (26% coverage vs 90% target)"
    archived_date: "2025-10-25"

  bnn_laplace:
    status: "archived"
    reason: "9/9 configurations failed with Hessian dimension errors"
    archived_date: "2025-11-01"

  bnn_multioutput_v1:
    status: "archived"
    reason: "Data leakage from Vegas lines (84.7% SHAP importance)"
    archived_date: "2025-11-05"
    file_deleted: true
    original_size: "298 MB"

  bnn_multioutput_passing_v2:
    status: "archived"
    reason: "NaN losses from epoch 0 despite Week 0 fix and canonical window"
    archived_date: "2025-11-09"
    file_path: "models/bayesian/bnn_multioutput_passing_v1_canonical.pt"
    notes: |
      6th consecutive BNN failure. Week 0 data contamination fixed (5,316 yards outlier removed),
      but NaN losses persist. Fundamentally incompatible architecture for passing yards variance.
      See Appendix I of dissertation for full investigation (84 person-hours, 26 days).

# Ensemble Configuration
ensemble:
  name: "5-Way Ensemble v6.0 (XGBoost Ridge Residuals)"  # UPDATED Nov 14, 2025
  version: "v6.0"  # NEW: Adds XGBoost v4 Ridge Residuals (4.70 MAE, 88% improvement)
  components:
    - model: "state_space_v2"
      weight: 0.27  # APPROVED Nov 8, 2025 (47.77 MAE)
      status: "CONVERGED"
    - model: "hierarchical_v2"
      weight: 0.27  # Bayesian hierarchical model
      status: "CONVERGED"
    - model: "xgboost_v4_ridge"
      weight: 0.00  # DISABLED Dec 17, 2025: Target leakage (residual_feature)
      status: "DISABLED"
      description: "Two-stage: Ridge opponent baseline + XGBoost residual learning. FIX: scripts/xgb_exp7_fixed_leakage.py"
    - model: "informative_priors_v2"
      weight: 0.13  # Informative priors Bayesian model
      status: "PRODUCTION"
    - model: "hybrid_static_incremental_v1"
      weight: 0.10  # 70% static + 30% incremental XGBoost (+4.2% improvement)
      status: "PRODUCTION"
  excluded_models:
    - "bnn_multioutput_v3_1"  # EXCLUDED: rushing-only model (not for passing predictions)
    - "xgboost_v2"  # Archived (superseded by xgboost_v4_ridge)
    - "elo_predictor"  # EXCLUDED: Not implemented yet
  post_processing_pipeline:
    - stage: "1_ensemble_aggregation"
      operation: "weighted_average"
      models: ["state_space_v2", "hierarchical_v2", "xgboost_v4_ridge", "informative_priors_v2", "hybrid_static_incremental_v1"]
      weights: [0.35, 0.35, 0.00, 0.15, 0.15]  # Updated Dec 17, 2025: XGBoost disabled, redistributed
      adaptive_reoptimization: false  # Static weights for v6.0
    - stage: "2_uncertainty_combination"
      operation: "variance_pooling"
    - stage: "3_calibration"
      operation: "temperature_scaling"
      model: "temperature_scaler_5way"  # Updated for 5-way ensemble
      temperature: 0.5534  # Will be recalibrated for 5-way
      status: "REQUIRED"  # Mandatory in v6.0
    - stage: "4_bet_sizing"
      operation: "cql_betting"
      model: "cql_bet_sizer"
      risk_gates: ["edge >= 2%", "kelly_fraction = 0.25", "daily_stop_loss = -10%"]
  aggregation_method: "weighted_average"  # Static weights for v6.0
  uncertainty_combination: "variance_pooling"
  weight_optimization_path: null  # No adaptive weights in v6.0

  expected_performance:
    roi: "+6.0-8.0%"  # IMPROVED with XGBoost v4 Ridge Residuals
    win_rate: "60-62%"  # IMPROVED with residual learning
    sharpe_ratio: "2.4-2.8"  # IMPROVED with better point predictions
    max_drawdown: "-7% to -9%"  # IMPROVED risk management
    mae_yards: "32-35"  # Target with XGBoost v4 (4.70 MAE component reduces ensemble error by ~7 yards)
    calibration_90pct: "≥89%"  # With temperature scaler (REQUIRED)
    prediction_interval_width: "Sharper with mandatory temperature scaling"
    weight_sum: 1.00
    inference_time: "<500ms"  # Target: sub-second predictions

  backtesting:
    period: "2022-2024 (in progress)"
    status: "phase1_features_complete"
    note: |
      v6.0 (Nov 14, 2025): 5-way ensemble with ELO and adaptive WLS weights.
      Components:
      - State-Space v2: 27% (adaptive WLS)
      - Hierarchical v2: 27% (adaptive WLS)
      - Hybrid XGBoost v1: 23% (adaptive WLS)
      - Informative Priors v2: 13% (adaptive WLS)
      - ELO Predictor: 10% (NEW - team strength component)

      **Key Improvements over v5.1:**
      - Adds opponent strength modeling via ELO ratings
      - Adaptive WLS weight optimization (reoptimize weekly on validation set)
      - Mandatory temperature scaling for better calibration
      - Expected improvement: +0.5% ROI from ELO, +0.5-1.0% from adaptive weights

      **Status:**
      - Phase 1 features backtested (2022-2024) ✅
      - Full 5-way ensemble backtest: PENDING
      - A/B test framework: PENDING

