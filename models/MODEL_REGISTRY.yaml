# Archived/Failed Models
archived_models:
  # BNN Variants (All Failed)
  bnn_nuts:
    status: "archived"
    reason: "Timeout after 6+ hours per configuration"
    archived_date: "2025-10-15"

  bnn_mc_dropout:
    status: "archived"
    reason: "Gradient explosion → NaN losses after epoch 12-18"
    archived_date: "2025-10-20"

  bnn_temperature_unscaled:
    status: "archived"
    reason: "Severe undercalibration (26% coverage vs 90% target)"
    archived_date: "2025-10-25"

  bnn_laplace:
    status: "archived"
    reason: "9/9 configurations failed with Hessian dimension errors"
    archived_date: "2025-11-01"

  bnn_multioutput_v1:
    status: "archived"
    reason: "Data leakage from Vegas lines (84.7% SHAP importance)"
    archived_date: "2025-11-05"
    file_deleted: true
    original_size: "298 MB"

  bnn_multioutput_passing_v2:
    status: "archived"
    reason: "NaN losses from epoch 0 despite Week 0 fix and canonical window"
    archived_date: "2025-11-09"
    file_path: "models/bayesian/bnn_multioutput_passing_v1_canonical.pt"
    notes: |
      6th consecutive BNN failure. Week 0 data contamination fixed (5,316 yards outlier removed),
      but NaN losses persist. Fundamentally incompatible architecture for passing yards variance.
      See Appendix I of dissertation for full investigation (84 person-hours, 26 days).

# Ensemble Configuration
ensemble:
  name: "4-Way Hybrid Ensemble"  # UPDATED Nov 12, 2025
  version: "v6.0"  # UPDATED from v4.2 (hybrid XGBoost integration)
  components:
    - model: "state_space_v2"
      weight: 0.30
      status: "CONVERGED"
    - model: "hierarchical_v2"
      weight: 0.25
      status: "CONVERGED"  # Rhat 1.0141 < 1.02 relaxed threshold
    - model: "bnn_multioutput_v3_1"
      weight: 0.25
      status: "CALIBRATED"
    - model: "hybrid_static_incremental_v1"
      weight: 0.20
      status: "PRODUCTION"  # NEW: Replaces xgboost_v2
  excluded_models:
    - "informative_priors_v2"  # Temporarily excluded (weight redistributed)
    - "xgboost_v2"  # Archived (superseded by hybrid)
  aggregation_method: "weighted_average"
  uncertainty_combination: "variance_pooling"
  post_processing:
    - "CQL bet sizing with 4 risk gates"
    - "Minimum edge filter (2%)"
    - "Kelly Criterion fractional betting (f=0.25)"

  expected_performance:
    roi: "+5.5-7.5%"  # IMPROVED with hybrid XGBoost (+0.5-1.0% boost)
    win_rate: "59-61%"
    sharpe_ratio: "2.3-2.7"  # IMPROVED with hybrid stability
    max_drawdown: "-8% to -10%"
    mae_yards: "37-39"  # IMPROVED (hybrid: 38.03 vs static: 39.66)
    calibration_90pct: "≥89%"

  backtesting:
    period: "2022-2024 (planned)"
    status: "pending_full_backtest_v6"
    note: |
      Updated Nov 12, 2025 (v6.0): Hybrid static-incremental XGBoost integration.
      Hybrid model achieves +4.2% improvement over pure static (38.03 vs 39.66 MAE).
      Expected ensemble improvement: +0.5-1.0% ROI boost from XGBoost component alone.
      Full backtest required to validate v6 ensemble performance.

