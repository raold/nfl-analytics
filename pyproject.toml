[project]
name = "nfl-analytics"
version = "0.1.0"
description = "NFL Sports Betting Analytics & Research Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "meteostat>=1.6.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "redis>=4.5.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "pytz>=2024.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "responses>=0.25.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.26.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.8.0",
]
# FastAPI service (api/, nfl_analytics/api/, nfl_analytics/production/real_time_api.py)
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
]
# Kalshi client and trading (nfl_analytics/markets, trading); Sibyl is the maintained successor
trading = [
    "cryptography>=42.0.0",
    "h2>=4.1.0",  # KalshiClient uses httpx with http2=True
    "websockets>=12.0",
    "anthropic>=0.40.0",
]
# Online learning (nfl_analytics/online, ensemble hybrid models)
online = [
    "river>=0.21.0",
]
torch = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
]
# Reinforcement learning environments (also needs the torch extra)
rl = [
    "gymnasium>=0.29.0",
]
bayes = [
    "pymc>=5.16.0",
    "arviz>=0.19.0",
]
causal = [
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "cvxpy>=1.5.0",
    "networkx>=3.3",
    "shap>=0.46.0",
    "optuna>=3.6.0",
    "mapie>=0.8.0",
]
# LLM feature stack (nfl_analytics/semantic); imports are lazy/guarded
semantic = [
    "transformers>=4.44.0",
    "sentence-transformers>=3.0.0",
    "peft>=0.12.0",
    "google-generativeai>=0.7.0",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
    "mlx>=0.18.0; sys_platform == 'darwin'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin'",
]
# Python <-> R bridge (ensemble v5 R model interface)
r = [
    "rpy2>=3.5.0",
]
dashboard = [
    "streamlit>=1.36.0",
]
# Distributed compute workers (nfl_analytics/compute)
compute = [
    "pynvml>=11.5.0",
    "docker>=7.1.0",
    "flask>=3.0.0",
]
research = [
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "nbformat>=5.10.0",
    "quarto>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nfl_analytics"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=nfl_analytics",
    "--cov-report=term-missing:skip-covered",
    "-ra",
]
markers = [
    "unit: Fast unit tests with no I/O",
    "integration: Needs live services (Postgres, Redis, Docker, API); auto-applied to tests/{integration,infrastructure,e2e}",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Takes > 10s; skipped unless --runslow",
    "api: Interacts with external APIs (usually mocked)",
    "db: Requires a database connection",
    "r: Invokes R scripts",
    "critical: P0 tests guarding expensive failures",
    "benchmark: Performance benchmarks",
]

[tool.coverage.run]
source = ["nfl_analytics"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py", "*/conftest.py", ".venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
