# Grafana Dashboard Provisioning
# Automatically imports dashboard JSON files

apiVersion: 1

providers:
  - name: 'NFL Props Dashboards'
    orgId: 1
    folder: 'NFL Analytics'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
