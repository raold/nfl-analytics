# Grafana Dashboard Provisioning for System Monitoring
# Automatically imports system monitoring dashboard JSON files

apiVersion: 1

providers:
  - name: 'NFL Analytics System Monitoring'
    orgId: 1
    folder: 'System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
