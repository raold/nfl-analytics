# docker-compose.dev.yml - Development Environment Overrides
# Purpose: Enable hot reload and development-friendly settings
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Features:
# - API hot reload (45s → 5s iteration cycle)
# - Debug logging
# - Development ensemble version selection
# - Streamlit debug mode
#
# Created: 2025-11-22 - Phase 6 Frontend Agents (Development Workflow Optimizer)

services:
  # ====================================================================
  # API - Enable Hot Reload
  # ====================================================================
  api:
    environment:
      - API_RELOAD=true  # Enable uvicorn --reload for instant code changes
      - LOG_LEVEL=DEBUG
      - ENSEMBLE_VERSION=v6  # Use latest experimental version in dev
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - 8000
      - --reload  # Hot reload on file changes (2-3s feedback loop)
      - --log-level
      - debug

  # ====================================================================
  # Streamlit - Enable Debug Mode
  # ====================================================================
  streamlit:
    environment:
      - STREAMLIT_LOGGER_LEVEL=debug
      - STREAMLIT_CLIENT_TOOLBAR_MODE=developer
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
