# Feature Weights Configuration
# ==============================
# Set weight=0.0 to disable feature groups without removing code.
# This allows easy re-enabling for future experiments.
#
# Updated: 2025-12-31; reasons corrected 2026-10-25
# Rationale: ADR-015 disabled the Kalman/GP groups. The "A/B test" first cited for it (v2 10.45
# spread MAE vs v2.1 10.70) is not evidence either way: 10.45 is v2's 2024 early-stopping score,
# 10.70 is v2.1 early-stopped on 2025, so the two are different seasons, each tuned on the season
# reported (docs/investigations/2026-10-final-evaluation/retraction_ledger.md C16, C17). The GP
# group stays off on engineering grounds: it never trains and its inputs are estimated.

feature_groups:
  # =====================================================
  # DISABLED FEATURE GROUPS
  # =====================================================

  kalman_epa:
    weight: 0.0
    reason: "DISABLED (ADR-015); the A/B comparison once cited is invalid (retraction ledger C16)"
    disabled_date: "2025-12-31"
    features:
      - "kal_home_*"      # 8 home team Kalman features
      - "kal_away_*"      # 8 away team Kalman features
      - "kal_*_diff"      # 2 differential features
    notes: |
      Kalman filter for EPA regime detection with CUSUM.
      EPA already captured by existing features (redundant).
      CUSUM regime changes don't correlate with game outcomes.
      2-season lookback may be insufficient for stable estimates.

  gp_injury:
    weight: 0.0
    reason: "DISABLED: GP never trains, uses fake estimated data (ADR-015)"
    disabled_date: "2025-12-31"
    features:
      - "gp_*"            # 8 GP recovery features
      - "injury_*"        # 9 injury type flags
    notes: |
      GP injury recovery curves never actually train (self._trained=False).
      Uses exponential_decay_baseline() with arbitrary parameters.
      days_since_return is ESTIMATED from severity index (14 - severity * 2), NOT real data.
      Uncertainty bounds are heuristic (15.0 magic number), not calibrated.

  # =====================================================
  # ENABLED FEATURE GROUPS (weight=1.0)
  # =====================================================

  semantic:
    weight: 1.0
    # The semantic stack was removed in the 2026-10 prune (tag archive/pre-prune-2026-10). Its A/B
    # tests were simulated or had no valid control, and its training inputs used look-ahead
    # (retraction ledger C23-C25).
    reason: "No A/B test is running; the semantic stack was removed (retraction ledger C23-C25)"
    features:
      - "sem_*"           # 38 semantic LLM-derived features

  rest_differential:
    weight: 1.0
    # The "+25pp ATS swing" (ADR-013) was the spread sign bug. Graded correctly, home teams with
    # 3+ more days of rest covered 41.4% in 2025 (n = 29) and 49.0% in 2006-2024 (n = 512);
    # corr(rest difference, ATS margin) = +0.009 (retraction ledger C15).
    reason: "Enabled as an ordinary input; no ATS signal (the +25pp claim was a sign bug, C15)"
    features:
      - "rest_*"
      - "is_*_short_week"
      - "is_*_long_week"

  base_features:
    weight: 1.0
    reason: "Core v2 production features - proven performance"
    features:
      - "*"               # All other features enabled by default
