  # ============================================================================
  # OPTIMIZATION STUDIES
  # ============================================================================

  - id: OPT-001
    name: Regularization & Feature Ablation Study
    category: optimization_studies
    status: complete
    priority: critical
    created: 2025-10-25
    completed: 2025-10-28

    description: |
      Comprehensive study testing regularization strengths (alpha/lambda) and
      feature ablations to fix elevated win rate and calibration issues.

    hypothesis: |
      Strong regularization + removing harmful features will reduce overfitting,
      improve calibration, and achieve realistic 60-62% win rate.

    configuration:
      regularization_tested:
        - alpha: [2.0, 5.0, 10.0]
        - lambda: [2.0, 5.0, 10.0]

      feature_ablations:
        - baseline: 9 features only
        - baseline + phase5: Add away_short_rest, is_conference_game
        - baseline + harmful: Add extreme_cold, high_wind
        - full: All features

      calibration:
        - uncalibrated: Raw XGBoost probabilities
        - platt_scaling: Logistic calibration on 2024 season

    results:
      optimal_config:
        alpha: 5.0
        lambda: 5.0
        features: baseline (9) + beneficial phase5 (2) = 11 total
        removed_features: [extreme_cold, high_wind, dome_team_outdoor_wind]

      improvements:
        test_accuracy: 60.7%  # Down from 63.2% (more realistic)
        calibration_error: 2.8%  # Down from 9.3% (-70%)
        max_bet_size: 10%  # Down from 67% (more conservative)
        temporal_stability: Stable (no degradation 2021-2024)

      conclusion: |
        Regularization is primary solution. Feature ablation provides marginal
        benefit. Platt Scaling critical for calibration.

    outputs:
      documentation: analysis/REGULARIZATION_FEATURE_ABLATION_SUMMARY.md
      results: analysis/OPTIMIZED_ENSEMBLE_FINAL_SUMMARY.md

    dissertation_chapters: [4, 8]
    frontend_integration: true  # Used in production ensemble
    production_ready: true

  - id: OPT-002
    name: BNN Hyperparameter Bayesian Optimization
    category: optimization_studies
    status: in_progress
    priority: low
    created: 2025-10-12
    completed: null

    description: |
      Bayesian optimization of BNN hyperparameters (learning rate, dropout,
      hidden dims, prior sigma) using Optuna.

    hypothesis: |
      Bayesian optimization can find better hyperparameter configurations than
      manual tuning, improving BNN calibration and accuracy.

    configuration:
      search_space:
        learning_rate: [1e-4, 1e-2]  # Log scale
        dropout: [0.1, 0.5]
        hidden_dim_1: [32, 128]
        hidden_dim_2: [16, 64]
        prior_sigma: [0.5, 2.0]

      optimization:
        n_trials: 50
        sampler: TPE  # Tree-structured Parzen Estimator
        pruner: Median
        objective: Maximize 90% CI coverage

    results: null  # IN PROGRESS

    outputs:
      logs: logs/optimization/pilot_study.log
      results: experiments/optimization/bnn_hyperparameter_search_results.json

    dissertation_chapters: [6]
    frontend_integration: false
    production_ready: false

    next_steps:
