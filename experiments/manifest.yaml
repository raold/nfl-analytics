  - id: GNN-001
    name: GNN Ablation Study - 9 Configurations
    category: graph_neural_networks
    status: complete
    priority: high
    created: 2025-10-05
    completed: 2025-10-08

    description: |
      Comprehensive ablation study testing 9 GNN configurations: baseline,
      architecture variants, edge ablations.

    hypothesis: |
      GNN can capture schedule network structure and team relationships to
      improve predictions beyond traditional features.

    configuration:
      base_architecture:
        embedding_dim: 64
        hidden_dim: 128
        num_message_rounds: 3
        edge_types: [plays_against, chemistry]

      ablations:
        - name: Baseline (Full Model)
        - name: No Chemistry Edges
        - name: Embedding Dim 32
        - name: Embedding Dim 128
        - name: 1 Message Round
        - name: 2 Message Rounds
        - name: 5 Message Rounds
        - name: Small Model (embed=32, hidden=64, msg=2)
        - name: Large Model (embed=128, hidden=256, msg=5)

      data:
        seasons: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
        train_val: 2016-2023
        test: 2024-2025

      training:
        epochs: 20
        batch_size: 32
        learning_rate: 0.001
        device: cpu  # MPS has tensor corruption bug

    results:
      baseline:
        val_brier: 0.2337
        test_accuracy: 0.469
        test_auc: 0.548
        test_brier: 0.2549

      best_config:
        name: Large Model
        val_brier: 0.2150  # 7.9% better than baseline
        test_accuracy: 0.469
        test_auc: 0.548
        test_brier: 0.2549

      conclusion: |
        GNN standalone accuracy (46-50%) significantly worse than ensemble (60.7%).
        Recommendation: Use GNN embeddings as features (INT-005), not standalone.

    outputs:
      results: models/gnn/ablation/ablation_results.json
      models: models/gnn/ablation/config_*.pt
      logs: logs/gnn/ablation_study_CPU.log

    dissertation_chapters: [4, 8]
    dissertation_section: Section 4.4 - GNN Ablation Study
    frontend_integration: false
    production_ready: false

    next_steps:
      - INT-005: Extract GNN embeddings as ensemble features
      - Analyze learned team representations
      - Document GNN failure + repurposing strategy

