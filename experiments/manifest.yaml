  - id: BNN-005
    name: BNN Prior Sensitivity Study
    category: bayesian_neural_networks
    status: complete
    priority: low
    created: 2025-10-10
    completed: 2025-10-12

    description: |
      Sensitivity analysis of BNN prior distributions (sigma = 0.5, 0.7, 1.0, 1.5).
      Tests impact of prior strength on calibration and accuracy.

    hypothesis: |
      Weaker priors (sigma=1.5) may improve calibration at cost of accuracy,
      while stronger priors (sigma=0.5) may overfit.

    configuration:
      priors_tested: [0.5, 0.7, 1.0, 1.5]
      architecture: Same as BNN Multioutput v1
      n_trials_per_prior: 1

    results:
      sigma_0_5:
        accuracy: 0.591
        ci_coverage: 0.887
        ci_width: 48.2

      sigma_0_7:
        accuracy: 0.588
        ci_coverage: 0.903
        ci_width: 51.7

      sigma_1_0:
        accuracy: 0.583
        ci_coverage: 0.920
        ci_width: 52.3

      sigma_1_5:
        accuracy: 0.579
        ci_coverage: 0.934
        ci_width: 55.8

      conclusion: |
        Sigma=1.0 provides best balance of accuracy (58.3%) and calibration (92.0%).
        Selected for production BNN Multioutput v1.

    outputs:
      results: experiments/calibration/prior_sensitivity_*.json
      plots: experiments/calibration/prior_sensitivity_comparison.png

    dissertation_chapters: [6, 8]
    frontend_integration: false
    production_ready: true  # Informs production BNN choice

