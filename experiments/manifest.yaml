  - id: PROD-001
    name: Game Outcome Ensemble v2025 - Optimized & Deployed
    category: production_ensemble
    status: complete
    priority: critical
    created: 2025-10-30
    completed: 2025-10-30

    description: |
      Production ensemble with regularization, feature ablation, and Platt Scaling.
      Deployed for 2025 season predictions (weeks 1-7).

    hypothesis: |
      Strong regularization (alpha=5.0, lambda=5.0) + feature ablation +
      calibration will achieve realistic 60-62% accuracy with < 3% calibration error.

    configuration:
      train_seasons: [2019, 2020, 2021, 2022, 2023]
      calibration_season: 2024
      prediction_season: 2025
      n_train_games: 1390
      n_calibration_games: 285
      n_prediction_games: 107

      xgboost:
        alpha: 5.0
        lambda: 5.0
        max_depth: 4
        learning_rate: 0.1
        n_estimators: 100
        subsample: 0.8
        colsample_bytree: 0.8

      features:
        baseline: 9  # home_win_pct, away_win_pct, points, etc.
        phase5: 2    # away_short_rest, is_conference_game
        total: 11
        removed: [extreme_cold, high_wind, dome_team_outdoor_wind]

      betting_criteria:
        min_edge: 0.05
        max_kelly_fraction: 0.10
        prob_clip_low: 0.15
        prob_clip_high: 0.85

    results:
      train_accuracy: 0.720
      test_accuracy: 0.607  # From validation study
      calibration_error: 0.028  # 70% improvement from 0.093
      predictions_generated: 107
      bets_recommended: 35
      bet_percentage: 0.327
      avg_edge: 0.072
      avg_kelly: 0.10

      validation_metrics:
        2021_accuracy: 0.628
        2022_accuracy: 0.570
        2023_accuracy: 0.614
        2024_accuracy: 0.582

      performance_vs_baseline:
        old_win_rate: 0.632  # Artificially elevated
        new_win_rate: 0.607  # Realistic
        old_calibration_error: 0.093
        new_calibration_error: 0.028
        improvement: -70%

    outputs:
      predictions: predictions/2025/optimized_ensemble_predictions_2025.csv
      bets: predictions/2025/recommended_bets_2025.csv
      metadata: predictions/2025/deployment_metadata_2025.json
      logs: logs/deployment/deploy_2025.log
      documentation: analysis/OPTIMIZED_ENSEMBLE_2025_DEPLOYMENT.md

    dissertation_chapters: [4, 8, 9]
    frontend_integration: true
    production_ready: true

    next_steps:
      - Monitor performance on 2025 weeks 8-22
      - Monthly calibration checks
      - Quarterly performance reviews
      - A/B test stricter betting criteria

  # ============================================================================
  # BAYESIAN NEURAL NETWORKS (Research Spoke)
  # ============================================================================

  - id: BNN-001
    name: BNN Multioutput v1 - Rushing Yards & TDs
    category: bayesian_neural_networks
    status: complete
    priority: high
    created: 2025-10-15
    completed: 2025-10-16

    description: |
      Multi-output Bayesian NN predicting rushing yards (regression) and
      rushing TDs (classification) with uncertainty quantification.

    hypothesis: |
      Multi-output BNN can achieve 90% CI coverage on rushing yards while
      maintaining competitive accuracy on TD prediction.

    configuration:
      architecture:
        input_dim: 11  # Team stats + contextual features
        hidden_layers: [64, 32]
        activation: relu
        dropout: 0.3
        outputs:
          rushing_yards:
            type: regression
            activation: linear
          rushing_tds:
            type: classification
            activation: sigmoid

      training:
        epochs: 50
        batch_size: 32
        learning_rate: 0.001
        optimizer: adam
        early_stopping_patience: 10
        samples: 1000  # MC dropout samples for uncertainty

      data:
        train_seasons: [2019, 2020, 2021, 2022, 2023]
        test_season: 2024
        n_train: 1390
        n_test: 285

    results:
      rushing_yards:
        mae: 18.50
        rmse: 24.79
        ci_coverage_90: 0.920  # ✅ Target: 0.90
        ci_width_avg: 52.3

      rushing_tds:
        brier_score: 0.2393
        accuracy: 0.583
        log_loss: 0.6247

    outputs:
      model: models/bayesian/bnn_multioutput_v1.pkl
      metadata: models/bayesian/bnn_multioutput_v1_metadata.json
      logs: logs/training/bnn_multioutput_v1.log

    dissertation_chapters: [6, 8]
    frontend_integration: false  # Pending INT-001
    production_ready: false      # Needs integration testing

    next_steps:
      - INT-001: Integrate uncertainty into ensemble
      - Add to frontend as confidence intervals
      - Test on 2025 season

