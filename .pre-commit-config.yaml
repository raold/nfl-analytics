repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 26.10.1  # keep in step with black in uv.lock (CI runs `uv run black --check`)
    hooks:
      - id: black
        files: ^(nfl_analytics|tests)/

  # Python linting: same blocking subset as CI (syntax errors, undefined names).
  # The full pyproject rule set reports ~1,300 legacy findings; run it manually.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # keep in step with ruff in uv.lock
    hooks:
      - id: ruff
        args: [--select, "E9,F63,F7,F82"]
        files: ^(nfl_analytics|tests|scripts|api)/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-python-dateutil]
        files: ^nfl_analytics/
        args: [--ignore-missing-imports, --warn-unused-ignores]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.tex)$
      - id: end-of-file-fixer
        exclude: ^(.*\.svg|.*\.png)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(package-lock\.json|docs/audits/.*|docs/optimization/.*)$

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]", "pbr"]
        files: ^nfl_analytics/

  # SQL formatting (optional - can be slow)
  # - repo: https://github.com/sqlfluff/sqlfluff
  #   rev: 2.3.2
  #   hooks:
  #     - id: sqlfluff-lint
  #       files: ^db/.*\.sql$
  #     - id: sqlfluff-fix
  #       files: ^db/.*\.sql$

  # Local hooks for project-specific validation
  - repo: local
    hooks:
      - id: check-hardcoded-dates
        name: Detect hardcoded temporal values
        entry: bash -c 'grep -Hn -E "(season|year)\s*[=<-]\s*20[0-9]{2}" "$@" || exit 0' --
        language: system
        files: \.(py|R)$
        exclude: ^(tests/|examples/|docs/)
        description: Detect hardcoded season/year values

      - id: spread-sign-convention
        name: Reject sportsbook-style spread cover math on nflverse spreads
        # games.spread_close / spread_line are nflverse (positive = home favored): the home
        # team covers when margin - spread_close > 0. Use nfl_analytics/utils/spread_convention.py.
        # A line that reproduces the retracted rule on purpose carries a '# sign-ok' comment.
        language: pygrep
        entry: '^(?!.*sign-ok).*(margin|_score|_diff)\W*\s*\+\s*\S*(spread_close|spread_line|vegas_spread)\b'
        files: \.(py|R|sql)$
        # Historical migrations (superseded by 104), the regression test that asserts the
        # old rule is wrong, and dependence_calibration.py (queries a non-existent `odds`
        # table of unknown sign convention)
        exclude: ^(archive/|research/|docs/|db/migrations/(005|006|100)_|tests/unit/test_spread_convention\.py$|nfl_analytics/analysis/dependence_calibration\.py$)

      - id: check-convergence-template
        name: Check MCMC convergence checks present
        entry: bash -c 'if grep -q "brm(" "$@" && ! grep -q "max_rhat" "$@"; then echo "❌ Missing convergence checks"; exit 1; fi' --
        language: system
        files: ^R/train_.*\.R$
        description: Validate R training scripts have convergence diagnostics

      # Phase 3 Enforcement Rules (Nov 15, 2025)
      - id: validate-api-contracts
        name: API Contract Validation
        entry: python nfl_analytics/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Catch deprecated ensemble parameters and missing db_password

      - id: validate-sql-results
        name: SQL Result Validation
        entry: python nfl_analytics/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Ensure SQL results checked before .iloc[0] access

      - id: validate-r-predictions
        name: R Prediction Validation
        entry: python nfl_analytics/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Validate R predictions checked for NaN

      - id: validate-ensemble-components
        name: Ensemble Component Validation
        entry: python nfl_analytics/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Ensure ensemble has minimum component checks

# Global settings
default_language_version:
  python: python3  # any interpreter satisfying requires-python (>=3.11)

# CI settings
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
