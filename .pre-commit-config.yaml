# Install once with `uvx pre-commit@4.7.0 install`. `uvx pre-commit@4.7.0 run --all-files`
# must pass without changing any file. CI enforces black, the ruff subset and
# spread-sign-convention (.github/workflows/ci.yml and temporal-safety.yml).
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1  # keep in step with black in uv.lock (CI runs `uv run black --check`)
    hooks:
      - id: black
        files: ^(nfl_analytics|tests)/

  # Same blocking subset as CI (syntax errors, undefined names). The full pyproject rule
  # set reports 218 legacy findings on nfl_analytics, tests and scripts (2026-10-25); run
  # `uv run ruff check` by hand for those.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # keep in step with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--select, "E9,F63,F7,F82"]
        files: ^(nfl_analytics|tests|scripts)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      # Generated or frozen files keep their exact bytes: dissertation sources and outputs
      # (analysis/), model artifacts, data, historical SQL and reports (db/migrations,
      # db/audit, db/*.txt), the pg_dump schema (db/schema), investigation outputs and the
      # SQL test fixtures.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: &frozen ^(analysis/|models/|data/|db/(migrations|audit|schema)/|db/[^/]+\.txt$|docs/investigations/[^/]+/(results|evidence)/|tests/sql/)
      - id: end-of-file-fixer
        exclude: *frozen

  - repo: local
    hooks:
      # games.spread_close / spread_line are nflverse lines (positive = home favored): the home
      # team covers when margin - spread_close > 0 (nfl_analytics/utils/spread_convention.py).
      # The entry rejects, one alternative per line:
      #   1. an identifier containing margin, score, diff or actual, then +, then one containing
      #      spread: the sportsbook cover rule, including actual_spread + sportsbook_spread;
      #   2-3. margin > -spread_close and (home_score - away_score) > -spread_close;
      #   4. a favorite taken from spread_close < 0 (that is the home underdog);
      #   5. total/2 - spread/2 (or (total - spread)/2) as the home mean (that is the away mean);
      #   6. rule 1 with the operands reversed, compared with 0 or the away score: spread_close +
      #      margin > 0, spread_close + home_score - away_score > 0 (not a negated -spread).
      # A line that reproduces or quotes the old rule on purpose, or uses a sportsbook-sign line
      # (odds_history.home_spread, negative = home favored), carries '# sign-ok: <reason>'.
      # scripts/dev/check_spread_sign_hook.py tests this entry against known wrong and right lines.
      - id: spread-sign-convention
        name: Reject sportsbook-style spread math on nflverse spreads
        language: pygrep
        entry: >-
          ^(?!.*sign-ok)(?x:
          .*(?:margin|score(?!s\b)|diff|actual)\w*\W*\s*\+\s*\S*spread(?!_?(?:std|sd|se|var|mae|rmse|err))
          | .*\b(?!away)\w*(?:margin|diff)\w*\W*\s*(?:[<>]=?|==)\s*-\s*\S*spread
          | .*home_score\s*-\s*\S*away_score\W*\s*(?:[<>]=?|==)\s*-\s*\S*spread
          | (?!.*(?i:away|road|visit))(?=.*(?i:fav)).*\b(?:spread_close|spread_line|vegas_spread)\b\W*\s*<=?\s*0(?![\d.])
          | (?!.*(?i:away|road|visit))(?=.*(?i:home)).*total\w*\W*\s*(?:/\s*2(?:\.0*)?\s*-\s*\S*spread|-\s*\S*spread\w*\W*\s*\)\s*/\s*2)
          | .*(?:^|[\s(=,\[])[\w.$]*(?:\[["']?)?\w*spread(?!_?(?:std|sd|se|var|mae|rmse|err))\w*\W*\s*\+\s*\S*(?:margin|score|diff|actual)\w*\W*\s*(?:-\s*\S*score\w*\W*\s*)?(?:[<>]=?|==)\s*(?:0(?![\d.])|\S*score)
          )
        files: \.(py|[Rr]|sql|qmd|[Rr]md)$
        # Superseded views (005, 006, 100; migration 104 replaced them in devdb01) and the two
        # tests that hold the old rule as data.
        exclude: ^(db/migrations/(005|006|100)_|tests/unit/test_spread_convention\.py$|scripts/dev/check_spread_sign_hook\.py$)

default_language_version:
  python: python3  # any interpreter satisfying requires-python (>=3.11)
