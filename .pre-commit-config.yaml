repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3.11
        files: ^py/

  # Python linting & auto-fixing
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.286
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^py/

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-python-dateutil]
        files: ^py/
        args: [--ignore-missing-imports, --warn-unused-ignores]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.tex)$
      - id: end-of-file-fixer
        exclude: ^(.*\.svg|.*\.png)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(package-lock\.json|docs/audits/.*|docs/optimization/.*)$

  # Python security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]", "pbr"]
        files: ^py/

  # SQL formatting (optional - can be slow)
  # - repo: https://github.com/sqlfluff/sqlfluff
  #   rev: 2.3.2
  #   hooks:
  #     - id: sqlfluff-lint
  #       files: ^db/.*\.sql$
  #     - id: sqlfluff-fix
  #       files: ^db/.*\.sql$

  # Data Layer Analyzer - Column lineage and impact analysis
  - repo: local
    hooks:
      - id: validate-schema-changes
        name: Data Layer Impact Analysis
        entry: ./scripts/analyze_data_layer.sh validate
        language: system
        files: ^db/migrations/.*\.sql$
        pass_filenames: true
        description: Validate database migrations for breaking changes

      - id: check-file-organization
        name: File Organization Check
        entry: python3 scripts/check_file_organization.py
        language: system
        files: ^\./[^/]+\.(md|txt)$
        description: Prevent documentation files in root directory

      - id: check-hardcoded-dates
        name: Detect hardcoded temporal values
        entry: bash -c 'grep -Hn -E "(season|year)\s*[=<-]\s*20[0-9]{2}" "$@" || exit 0' --
        language: system
        files: \.(py|R)$
        exclude: ^(tests/|examples/|docs/)
        description: Detect hardcoded season/year values

      - id: check-brms-predictions
        name: Validate brms posterior_predict calls
        entry: python scripts/check_brms_predictions.py
        language: system
        files: \.R$
        exclude: ^(tests/|examples/)
        description: Ensure posterior_predict has sample_new_levels parameter

      - id: check-convergence-template
        name: Check MCMC convergence checks present
        entry: bash -c 'if grep -q "brm(" "$@" && ! grep -q "max_rhat" "$@"; then echo "❌ Missing convergence checks"; exit 1; fi' --
        language: system
        files: ^R/train_.*\.R$
        description: Validate R training scripts have convergence diagnostics

      # Phase 3 Enforcement Rules (Nov 15, 2025)
      - id: validate-api-contracts
        name: API Contract Validation
        entry: python py/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Catch deprecated ensemble parameters and missing db_password

      - id: validate-sql-results
        name: SQL Result Validation
        entry: python py/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Ensure SQL results checked before .iloc[0] access

      - id: validate-r-predictions
        name: R Prediction Validation
        entry: python py/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Validate R predictions checked for NaN

      - id: validate-ensemble-components
        name: Ensemble Component Validation
        entry: python py/utils/enforcement_router.py
        language: system
        files: \.(py)$
        pass_filenames: true
        description: Ensure ensemble has minimum component checks

# Global settings
default_language_version:
  python: python3.11

# CI settings
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
