# Alertmanager Configuration
# Notification routing for NFL Analytics alerts

global:
  # Default: 5 minutes before retrying a failed notification
  resolve_timeout: 5m

  # Email configuration (Gmail SMTP)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'nfl-analytics@example.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Notification templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree
route:
  # Default receiver
  receiver: 'default'

  # Group alerts by severity and component
  group_by: ['severity', 'component']

  # Wait time before sending initial notification
  group_wait: 30s

  # Wait time before sending updates on grouped alerts
  group_interval: 5m

  # Minimum interval between identical alerts
  repeat_interval: 4h

  # Child routes for different severities
  routes:
    # CRITICAL alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: true  # Also send to default

    # WARNING alerts - less urgent
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 12h

    # INFO alerts - daily summary only
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 1h
      repeat_interval: 24h

# Inhibition rules (suppress less severe alerts when more severe are firing)
inhibit_rules:
  # Suppress warnings if critical alert is active
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component']

# Notification receivers
receivers:
  # Default receiver (console logging)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'  # Optional: custom webhook
        send_resolved: true

  # Critical alerts - email + webhook
  - name: 'critical-alerts'
    email_configs:
      - to: 'your-email@gmail.com'
        headers:
          Subject: '🚨 CRITICAL: NFL Analytics Alert - {{ .GroupLabels.component }}'
        html: |
          <h2>CRITICAL ALERT</h2>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <p><strong>Summary:</strong> {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}</p>
          <p><strong>Action:</strong> {{ range .Alerts }}{{ .Annotations.action }}{{ end }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>
    # Uncomment to enable Slack
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#nfl-analytics-alerts'
    #     title: 'CRITICAL: {{ .GroupLabels.component }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    #     color: 'danger'

  # Warning alerts - email only
  - name: 'warning-alerts'
    email_configs:
      - to: 'your-email@gmail.com'
        headers:
          Subject: '⚠️ WARNING: NFL Analytics - {{ .GroupLabels.component }}'
        html: |
          <h2>WARNING</h2>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <p><strong>Summary:</strong> {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}</p>
          <p><strong>Recommended Action:</strong> {{ range .Alerts }}{{ .Annotations.action }}{{ end }}</p>

  # Info alerts - daily digest
  - name: 'info-alerts'
    email_configs:
      - to: 'your-email@gmail.com'
        headers:
          Subject: 'ℹ️ INFO: NFL Analytics Daily Summary'
        html: |
          <h2>Daily Summary</h2>
          <p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>

