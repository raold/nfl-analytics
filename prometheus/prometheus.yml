# Prometheus Configuration for NFL Analytics Production System
# NFL Props Betting Monitoring Stack - Phase 1 Docker Infrastructure
# Last Updated: November 8, 2025
# Purpose: Monitor API, database, models, and system health

global:
  # Scrape interval: 15s for real-time metrics
  scrape_interval: 15s

  # Evaluation interval for recording rules and alerts
  evaluation_interval: 15s

  # How long until a scrape times out
  scrape_timeout: 10s

  # External labels to attach to all metrics
  external_labels:
    environment: 'production'
    project: 'nfl-analytics'
    monitor: 'props-betting'
    version: 'v1'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations for Phase 1 Docker Infrastructure
scrape_configs:

  # ============================================================================
  # API & Application Metrics
  # ============================================================================

  # NFL Analytics API - Real-time prediction and ensemble metrics
  - job_name: 'nfl_analytics_api'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme
        replacement: 'http'

  # Streamlit Dashboard - UI metrics and user interactions
  # DISABLED: Streamlit does not expose Prometheus metrics by default
  # - job_name: 'streamlit_dashboard'
  #   scrape_interval: 30s
  #   scrape_timeout: 5s
  #   static_configs:
  #     - targets: ['streamlit:8501']
  #   metrics_path: '/metrics'
  #   honor_timestamps: true

  # ============================================================================
  # Performance Metrics (Betting Results)
  # ============================================================================
  # DISABLED: These endpoints will be added when betting tracking is implemented
  # See: docs/betting/ for implementation roadmap

  # Bet outcomes, ROI, win rate, Sharpe ratio
  # - job_name: 'nfl_performance'
  #   scrape_interval: 30s
  #   scrape_timeout: 10s
  #   static_configs:
  #     - targets: ['api:8000']
  #   metrics_path: '/performance/metrics'
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: service
  #       replacement: 'performance'

  # ============================================================================
  # Model Quality Metrics
  # ============================================================================
  # DISABLED: These endpoints will be added when backtest tracking is implemented
  # See: py/backtest/ for implementation roadmap

  # Model calibration, MAE, coverage, drift detection
  # - job_name: 'nfl_model_quality'
  #   scrape_interval: 60s
  #   scrape_timeout: 10s
  #   static_configs:
  #     - targets: ['api:8000']
  #   metrics_path: '/model/metrics'
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: service
  #       replacement: 'model_quality'

  # Ensemble component metrics - Individual model performance
  # - job_name: 'nfl_ensemble'
  #   scrape_interval: 60s
  #   scrape_timeout: 10s
  #   static_configs:
  #     - targets: ['api:8000']
  #   metrics_path: '/ensemble/metrics'
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: service
  #       replacement: 'ensemble'

  # ============================================================================
  # Database Metrics
  # ============================================================================

  # PostgreSQL database - Query performance, connections, replication
  - job_name: 'postgres'
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: ['postgres_exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: database
        replacement: 'devdb01'

  # Redis cache - Memory usage, key stats, connection pool
  # DISABLED: redis_exporter container not running
  # To enable: Add redis_exporter service to docker-compose.yml
  # - job_name: 'redis'
  #   scrape_interval: 30s
  #   scrape_timeout: 5s
  #   static_configs:
  #     - targets: ['redis_exporter:9121']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: service
  #       replacement: 'redis'

  # ============================================================================
  # System & Infrastructure
  # ============================================================================

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['localhost:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prometheus:9090'

  # Node exporter - System metrics (CPU, memory, disk, network)
  - job_name: 'node'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['node_exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'node_exporter:9100'

  # Docker container metrics (via cAdvisor)
  # DISABLED: cAdvisor container not running
  # To enable: Add cAdvisor service to docker-compose.yml
  # - job_name: 'cadvisor'
  #   scrape_interval: 15s
  #   scrape_timeout: 5s
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #     metrics_path: '/metrics'

