# Prometheus Alert Rules for NFL Analytics System
# Production-grade alerts for props betting monitoring
# Last Updated: November 8, 2025

groups:
  # ====================================================================
  # CRITICAL ALERTS - Immediate Action Required (Kill Switch)
  # ====================================================================
  - name: critical_alerts
    interval: 30s
    rules:
      # Kill Switch: Severe drawdown (>15%)
      - alert: SevereDrawdown
        expr: props_drawdown_max > 0.15
        for: 5m
        labels:
          severity: critical
          component: risk
        annotations:
          summary: "KILL SWITCH: Max drawdown exceeded 15%"
          description: "Current max drawdown: {{ $value | humanizePercentage }}. HALT ALL BETTING IMMEDIATELY."
          action: "Execute rollback procedure. Check docs/ROLLBACK_PROCEDURES.md"

      # Kill Switch: Win rate collapse (<50% for 3 days)
      - alert: WinRateCollapse
        expr: rate(props_wins_total[3d]) / rate(props_bets_total[3d]) < 0.50
        for: 1h
        labels:
          severity: critical
          component: performance
        annotations:
          summary: "KILL SWITCH: Win rate below 50% for 3 days"
          description: "Win rate: {{ $value | humanizePercentage }}. System performance critically degraded."
          action: "Halt betting, investigate root cause, rollback to previous model version"

      # Calibration failure (<75% or >99%)
      - alert: CalibrationFailure
        expr: props_calibration_coverage < 0.75 or props_calibration_coverage > 0.99
        for: 24h
        labels:
          severity: critical
          component: model_quality
        annotations:
          summary: "BNN calibration critically out of range"
          description: "Calibration coverage: {{ $value | humanizePercentage }} (target: 85-95%)"
          action: "Model is producing unreliable uncertainty estimates. Rollback required."

      # System error rate spike (>5%)
      - alert: HighSystemErrorRate
        expr: rate(props_errors_total[5m]) / rate(props_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
          component: operations
        annotations:
          summary: "System error rate exceeds 5%"
          description: "Error rate: {{ $value | humanizePercentage }}. Check logs for failures."
          action: "Investigate application logs, check database connectivity, verify API health"

      # Weekly loss exceeds 10% of bankroll
      - alert: SevereWeeklyLoss
        expr: -(sum_over_time(props_profit_total[7d]) / props_bankroll) > 0.10
        for: 1h
        labels:
          severity: critical
          component: risk
        annotations:
          summary: "Weekly loss exceeds 10% of bankroll"
          description: "7-day P&L: {{ $value | humanize }} (>10% loss). Risk limits breached."
          action: "Halt betting immediately, perform root cause analysis"

  # ====================================================================
  # WARNING ALERTS - Monitor Closely, Reduce Risk
  # ====================================================================
  - name: warning_alerts
    interval: 1m
    rules:
      # Win rate below acceptable threshold (52%)
      - alert: LowWinRate
        expr: rate(props_wins_total[48h]) / rate(props_bets_total[48h]) < 0.52
        for: 2h
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Win rate below 52% for 48 hours"
          description: "Current win rate: {{ $value | humanizePercentage }}. Below acceptable threshold."
          action: "Reduce bet sizes by 50%, increase monitoring frequency to every 2 hours"

      # ROI trending negative
      - alert: NegativeROI
        expr: props_roi_total < 0
        for: 6h
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "ROI has turned negative"
          description: "Current ROI: {{ $value | humanizePercentage }}. Expected: +5-7%."
          action: "Review recent predictions, check for market condition changes"

      # Drawdown approaching limit (>10%)
      - alert: ModerateDrawdown
        expr: props_drawdown_current > 0.10
        for: 30m
        labels:
          severity: warning
          component: risk
        annotations:
          summary: "Current drawdown exceeds 10%"
          description: "Drawdown: {{ $value | humanizePercentage }}. Approaching 15% limit."
          action: "Reduce bet sizes by 50%, reduce max concurrent positions to 3"

      # Calibration drifting outside range (80-98%)
      - alert: CalibrationDrift
        expr: props_calibration_coverage < 0.80 or props_calibration_coverage > 0.98
        for: 12h
        labels:
          severity: warning
          component: model_quality
        annotations:
          summary: "BNN calibration drifting outside acceptable range"
          description: "Calibration: {{ $value | humanizePercentage }} (target: 85-95%)"
          action: "Review recent predictions, check for feature drift, consider model retrain"

      # MAE increasing significantly
      - alert: HighMAE
        expr: props_prediction_mae > 65
        for: 6h
        labels:
          severity: warning
          component: model_quality
        annotations:
          summary: "Model MAE exceeds 65 yards"
          description: "Current MAE: {{ $value }} yards. Model accuracy degrading."
          action: "Investigate feature drift, check for data quality issues"

      # High prediction latency (>1s at p95)
      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, props_prediction_latency_seconds_bucket) > 1.0
        for: 15m
        labels:
          severity: warning
          component: operations
        annotations:
          summary: "Prediction latency p95 exceeds 1 second"
          description: "p95 latency: {{ $value }}s. Performance degradation detected."
          action: "Check system resources (CPU, memory), optimize database queries"

      # Daily loss >3% of bankroll
      - alert: DailyLossThreshold
        expr: -(sum_over_time(props_profit_total[1d]) / props_bankroll) > 0.03
        for: 1h
        labels:
          severity: warning
          component: risk
        annotations:
          summary: "Daily loss exceeds 3% of bankroll"
          description: "24h P&L: {{ $value | humanize }} (>3% loss)"
          action: "Reduce risk, review recent bets for patterns"

  # ====================================================================
  # INFO ALERTS - Awareness and Daily Summaries
  # ====================================================================
  - name: info_alerts
    interval: 5m
    rules:
      # Daily summary (fires at 11:59 PM)
      - alert: DailySummary
        expr: hour() == 23 and minute() >= 55
        for: 5m
        labels:
          severity: info
          component: reporting
        annotations:
          summary: "Daily performance summary"
          description: "ROI: {{ props_roi_total }}%, Win Rate: {{ props_win_rate }}%, Bets: {{ props_bets_total }}"
          action: "Review daily dashboard, log performance metrics"

      # Model retrain completed
      - alert: ModelRetrainComplete
        expr: changes(props_model_version[5m]) > 0
        labels:
          severity: info
          component: model_quality
        annotations:
          summary: "Model retrain completed"
          description: "New model version deployed: {{ props_model_version }}"
          action: "Verify new model calibration, check validation metrics"

      # High exposure (>60% of bankroll)
      - alert: HighExposure
        expr: props_exposure_total / props_bankroll > 0.60
        for: 30m
        labels:
          severity: info
          component: risk
        annotations:
          summary: "Current exposure exceeds 60% of bankroll"
          description: "Exposure: {{ $value | humanizePercentage }} of bankroll"
          action: "Monitor closely, consider reducing position sizes"

      # Weekly performance review reminder
      - alert: WeeklyReviewReminder
        expr: day_of_week() == 2 and hour() >= 14  # Tuesday 2pm
        for: 5m
        labels:
          severity: info
          component: reporting
        annotations:
          summary: "Weekly performance review scheduled"
          description: "Time for weekly team review meeting"
          action: "Prepare weekly report, review KPIs vs targets"

  # ====================================================================
  # OPERATIONAL ALERTS - System Health
  # ====================================================================
  - name: operational_alerts
    interval: 30s
    rules:
      # Database down
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "PostgreSQL database is down"
          description: "Cannot scrape postgres_exporter. Database may be unreachable."
          action: "Check docker compose services, restart PostgreSQL container"

      # API endpoint unreachable
      - alert: APIUnreachable
        expr: up{job="nfl_analytics_api"} == 0
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "NFL Analytics API is unreachable"
          description: "Prometheus cannot scrape /metrics endpoint"
          action: "Check application status, review logs, restart service if needed"

      # High memory usage (>85%)
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "System memory usage exceeds 85%"
          description: "Available memory: {{ $value | humanizePercentage }}"
          action: "Check for memory leaks, restart heavy services, scale resources"

      # High disk usage (>90%)
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) > 0.90
        for: 15m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk usage exceeds 90%"
          description: "Disk space remaining: {{ $value | humanizePercentage }}"
          action: "Clean up old logs, archive model checkpoints, expand disk space"

      # Prometheus storage nearing limit
      - alert: PrometheusStorageFull
        expr: prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes > 0.90
        for: 30m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Prometheus storage nearing 90% of retention limit"
          description: "Storage usage: {{ $value | humanizePercentage }}"
          action: "Reduce retention period or increase storage limit"
