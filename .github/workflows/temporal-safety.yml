name: Temporal Safety Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # weekly, to catch drift

jobs:
  leakage-and-convention:
    name: Leakage detector and spread convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Offline guards: the leakage detector's own tests, and the nflverse spread sign
      # convention pinned to real games (docs/POSTMORTEMS.md section 4).
      - name: Run temporal-safety and convention tests
        run: >-
          uv run pytest --no-cov
          tests/unit/test_spread_convention.py
          tests/unit/test_data_leakage_prevention.py
          tests/unit/test_data_leakage_detector_comprehensive.py

      - name: Reject sportsbook-style spread math
        run: uvx pre-commit run spread-sign-convention --all-files
