name: Temporal Safety Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run on schedule to catch drift
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight

jobs:
  temporal-leakage-detection:
    name: Temporal Leakage Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      - name: Run temporal safety tests
        run: |
          source .venv/bin/activate
          pytest tests/integration/test_temporal_safety_comprehensive.py -v --tb=short
        continue-on-error: false  # BLOCK merge if temporal leakage found

      - name: Run data leakage detector on feature engineering
        run: |
          source .venv/bin/activate
          python -c "
          from py.utils.data_leakage_detector import DataLeakageDetector
          import sys
          import os

          detector = DataLeakageDetector()

          # Check all feature engineering modules
          feature_modules = [
              'py/features/asof_features.py',
              'py/features/asof_features_v2.py',
              'py/features/asof_features_enhanced.py',
              'py/features/player_features.py',
          ]

          critical_issues = []
          for module in feature_modules:
              if not os.path.exists(module):
                  continue

              with open(module) as f:
                  code = f.read()

              # Check for temporal leakage patterns
              issues = []
              if 'merge(' in code and 'how=' in code:
                  if 'asof' not in code.lower():
                      issues.append('CRITICAL: Non-asof merge detected')

              if 'groupby(' in code and 'shift(' not in code:
                  issues.append('WARNING: groupby without shift may leak future data')

              critical_issues.extend(issues)

          if critical_issues:
              print(f'FAIL: {len(critical_issues)} temporal leakage issues found:')
              for issue in critical_issues:
                  print(f'  - {issue}')
              sys.exit(1)

          print('PASS: Zero critical temporal leakage issues detected')
          "
        continue-on-error: false  # BLOCK merge if leakage found

      - name: Summary
        if: success()
        run: |
          echo "✅ PASS: All temporal safety validations passed"
          echo ""
          echo "Risk Mitigation:"
          echo "  - Zero temporal data leakage detected"
          echo "  - All 25+ temporal safety tests passing"
          echo "  - Feature engineering code validated"
          echo ""
          echo "This prevents catastrophic betting failures ($10,000+ loss risk)"
