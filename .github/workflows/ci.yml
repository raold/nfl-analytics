name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: true

      # torch, bayes, semantic etc. are optional extras; their tests skip when absent
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --extra trading --extra online

      - name: Lint (syntax errors and undefined names)
        run: uv run ruff check --select E9,F63,F7,F82 nfl_analytics tests scripts api

      - name: Format check
        run: uv run black --check nfl_analytics tests

      - name: Unit tests (no database)
        run: uv run pytest -m "not integration"
