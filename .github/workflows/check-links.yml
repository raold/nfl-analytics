name: Check Documentation Links

on:
  push:
    branches: [main]
    paths: ['**.md', '.lycheeignore', '.github/workflows/check-links.yml']
  pull_request:
    paths: ['**.md', '.lycheeignore', '.github/workflows/check-links.yml']
  schedule:
    - cron: '0 0 * * 0'  # weekly external-link sweep (Sunday 00:00 UTC)
  workflow_dispatch:

jobs:
  # Blocking: relative links between files in the repo must resolve.
  local-links:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            './*.md' 'docs/**/*.md' 'tests/*.md'
          fail: true

  # Non-blocking: external sites go down; report, don't fail.
  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            './*.md' 'docs/**/*.md' 'tests/*.md'
          fail: false
      - name: Summarize
        if: always()
        run: cat lychee/out.md >> "$GITHUB_STEP_SUMMARY" || true
